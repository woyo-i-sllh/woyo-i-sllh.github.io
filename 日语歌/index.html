<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的日语歌词卡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');

*{box-sizing:border-box}
body{margin:0;font-family:'ZCOOL KuaiLe','幼圆','YouYuan','Yu Gothic UI','Microsoft YaHei',system-ui,sans-serif;
  background:linear-gradient(160deg,#fdf6f8 0%,#eef1fb 60%,#f8f2fb 100%);min-height:100vh;color:#2b2623;}
.page{max-width:1000px;margin:0 auto;padding:50px 22px 70px;}
h1{text-align:center;font-size:clamp(26px,4vw,38px);letter-spacing:.12em;margin:0 0 6px;}
.sub{text-align:center;color:#7d716c;font-size:14.5px;margin:0 0 44px;}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:22px;}
.card{display:block;text-decoration:none;color:inherit;background:var(--bg);
  border-radius:20px;padding:26px 26px 20px;box-shadow:0 14px 34px rgba(70,60,90,.10);
  transition:transform .18s,box-shadow .18s;border:1px solid rgba(255,255,255,.7);}
.card:hover{transform:translateY(-5px);box-shadow:0 22px 46px rgba(70,60,90,.16);}
.c-num{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.3em;margin-bottom:14px;}
.c-title{font-size:clamp(24px,3vw,30px);font-family:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Noto Serif JP",serif;line-height:1.4;}
.c-title ruby rt{font-size:.42em;color:var(--accent);font-weight:600;}
.c-cn{margin-top:8px;color:#625a55;font-size:15px;letter-spacing:.08em;}
.c-artist{margin-top:12px;color:#8a7f7a;font-size:13px;}
.c-go{margin-top:20px;color:var(--accent);font-size:13.5px;font-weight:700;}
.note{text-align:center;margin-top:46px;color:#a09691;font-size:13px;line-height:2;}
</style>
</head>
<body>
<div class="page">
  <h1>🎵 我的日语歌词卡</h1>
  <p class="sub">日文歌词（汉字标注平假名）＋ 中文翻译，左右对照</p>
  <div class="cards">
    <a class="card" style="--accent:#d6336c;--bg:#ffe3ec;" href="好きだから。-『ユイカ』.html">
      <div class="c-num">1</div>
      <div class="c-title"><ruby>好き<rt>すき</rt></ruby>だから。</div>
      <div class="c-cn">因为喜欢你。</div>
      <div class="c-artist">『ユイカ』</div>
      <div class="c-go">打开歌词 →</div>
    </a>

    <a class="card" style="--accent:#3b5bdb;--bg:#e3ecff;" href="別の人の彼女になったよ-wacci.html">
      <div class="c-num">2</div>
      <div class="c-title"><ruby>別<rt>べつ</rt></ruby>の<ruby>人<rt>ひと</rt></ruby>の<ruby>彼女<rt>かのじょ</rt></ruby>になったよ</div>
      <div class="c-cn">我已经成了别人的女朋友</div>
      <div class="c-artist">wacci</div>
      <div class="c-go">打开歌词 →</div>
    </a></div>
  <p class="note">想加入新的歌？直接告诉我歌名就行，我会往这个文件夹里继续添加 ♪<br>
  歌词出典：歌ネット（uta-net.com）／翻译为个人学习用意译，请勿商用。</p>
</div>
</body>
</html>
